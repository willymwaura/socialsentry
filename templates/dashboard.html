<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SocialSentry — Tactical Intelligence Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#00D4FF', danger: '#FF2D55', warning: '#FF9500', success: '#30D158', dark: '#0F172A',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    * { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(12px); border: 1px solid rgba(0, 212, 255, 0.1); }
    /* HITL Status Styles */
    .status-verified { border-left: 8px solid #30D158 !important; background: rgba(48, 209, 88, 0.05); }
    .status-dismissed { opacity: 0.35; filter: grayscale(1); pointer-events: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.2); border-radius: 10px; }
  </style>
</head>
<body class="bg-dark text-white min-h-screen">

  <header class="border-b border-primary/20 glass sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center animate-pulse shadow-[0_0_20px_#00D4FF]">
          <i class="fa-solid fa-satellite text-black text-2xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-primary font-orbitron tracking-tight uppercase">SocialSentry</h1>
          <p class="text-[9px] uppercase tracking-[0.3em] opacity-50">Signal Intelligence Hub</p>
        </div>
      </div>
      <div class="text-right hidden sm:block">
        <div id="clock" class="text-xl font-mono text-primary font-orbitron">00:00:00</div>
        <div class="text-[10px] opacity-60">LOCAL OPS TIME (EAT)</div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6 mt-4">
    <!-- INTEL FEED -->
    <div class="lg:col-span-2 space-y-6">
      <div class="glass rounded-2xl p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-8">
          <h2 class="text-lg font-bold font-orbitron flex items-center gap-3">
            <span class="w-2 h-2 bg-danger rounded-full animate-ping"></span> 
            ENCRYPTED SIGNAL STREAM
          </h2>
          <div id="stats" class="text-[10px] font-bold opacity-60 uppercase tracking-widest">
            <span id="vCount" class="text-success">0</span> Verified • <span id="pCount" class="text-warning">0</span> Pending
          </div>
        </div>
        
        <div id="alertsContainer" class="space-y-4 overflow-y-auto pr-3 custom-scrollbar" style="max-height: calc(100vh - 300px);">
          <div class="text-center py-20 opacity-30 italic">Initializing signal Uplink...</div>
        </div>
      </div>
    </div>

    <!-- SIDEBAR TOOLS -->
    <div class="space-y-6">
      <div class="glass rounded-2xl p-4 h-[350px] relative overflow-hidden">
        <h3 class="text-[10px] font-bold font-orbitron mb-3 text-primary uppercase">Tactical Map Overlay</h3>
        <div id="map" class="w-full h-full rounded-xl border border-primary/10 bg-black/20"></div>
      </div>

      <div class="glass rounded-2xl p-6">
        <h3 class="text-[10px] font-bold font-orbitron mb-4 text-primary uppercase">Manual Command</h3>
        <textarea id="tweetInput" placeholder="Input raw message text..." class="w-full p-4 rounded-xl bg-black/40 border border-primary/10 text-sm focus:border-primary/40 outline-none transition h-24 resize-none"></textarea>
        <button id="analyzeBtn" class="w-full mt-4 py-4 bg-primary text-black font-black rounded-xl hover:shadow-[0_0_20px_rgba(0,212,255,0.4)] transition-all active:scale-95 text-[10px] uppercase font-orbitron">
          Process Signal
        </button>
      </div>

      <div class="glass p-5 rounded-2xl border-l-4 border-danger">
        <div id="criticalCount" class="text-4xl font-bold font-orbitron text-danger">0</div>
        <div class="text-[9px] opacity-50 uppercase font-black tracking-widest mt-1">High-Risk Detections</div>
      </div>
    </div>
  </main>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-KE', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    let mainMap, markerLayer;

    function initMap() {
      mainMap = L.map('map', { zoomControl: false, attributionControl: false }).setView([-1.2921, 36.8219], 6);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(mainMap);
      markerLayer = L.layerGroup().addTo(mainMap);
    }

    // HITL FUNCTION: Updates status in database via backend
    async function handleHITL(id, status) {
      const res = await fetch('/update_status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ alert_id: id, status: status })
      });
      if (res.ok) fetchAlerts(); // Re-render immediately
    }

    function renderAlerts(alerts) {
      document.getElementById('vCount').textContent = alerts.filter(a => a.status === 'verified').length;
      document.getElementById('pCount').textContent = alerts.filter(a => a.status === 'pending').length;
      document.getElementById('criticalCount').textContent = alerts.filter(a => a.analysis.severity >= 4 && a.status !== 'dismissed').length;
      
      markerLayer.clearLayers();
      const container = document.getElementById('alertsContainer');
      
      container.innerHTML = alerts.map(alert => {
        const a = alert.analysis;
        const status = alert.status || 'pending';
        const isVerified = status === 'verified';
        const isDismissed = status === 'dismissed';
        const sevColor = a.severity >= 4 ? '#FF2D55' : a.severity >= 3 ? '#FF9500' : '#30D158';

        // Add markers for map
        if (alert.location.lat && !isDismissed) {
          L.circleMarker([alert.location.lat, alert.location.lng], {
            radius: 7, color: sevColor, fillColor: sevColor, fillOpacity: 0.7, weight: 1
          }).addTo(markerLayer);
        }

        return `
          <div class="glass rounded-xl p-6 border-l-4 transition-all duration-300 ${isVerified ? 'status-verified' : ''} ${isDismissed ? 'status-dismissed' : ''}" 
               style="border-left-color: ${sevColor}">
            <div class="flex justify-between items-start mb-4">
              <div class="flex items-center gap-3">
                <span class="text-[9px] font-black px-2 py-0.5 rounded bg-primary text-black uppercase tracking-widest">${a.category}</span>
                <span class="text-[10px] font-bold text-white/30 italic">@${alert.meta.user} • ${alert.location.label}</span>
              </div>
              <div class="text-[10px] font-black px-2 py-0.5 rounded bg-white/5 text-white/60">SEV ${a.severity}</div>
            </div>
            
            <p class="text-sm mb-4 leading-relaxed text-white/90 italic">"${alert.text}"</p>
            
            <div class="bg-black/30 p-4 rounded-xl border border-white/5 text-[11px] mb-5 leading-relaxed">
              <span class="text-primary font-bold uppercase tracking-tighter block mb-1">AI Analyst Assessment:</span>
              ${a.summary}
            </div>
            
            <div class="flex justify-between items-center border-t border-white/5 pt-4">
              <div class="flex gap-2">
                ${a.indicators.map(i => `<span class="text-[9px] text-primary/40 font-mono">#${i}</span>`).join(' ')}
              </div>
              <div class="flex gap-3">
                ${status === 'pending' ? `
                  <button onclick="handleHITL(${alert.id}, 'dismissed')" class="px-4 py-1.5 bg-white/5 hover:bg-danger/20 rounded-lg text-[10px] font-bold transition-all uppercase">Dismiss</button>
                  <button onclick="handleHITL(${alert.id}, 'verified')" class="px-4 py-1.5 bg-primary text-black rounded-lg text-[10px] font-black hover:bg-cyan-400 transition-all uppercase">Verify</button>
                ` : `
                  <div class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest ${isVerified ? 'text-success' : 'text-white/20'}">
                    <i class="fa-solid ${isVerified ? 'fa-check-circle' : 'fa-times-circle'}"></i> ${status}
                  </div>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function fetchAlerts() {
      const res = await fetch('/alerts');
      const data = await res.json();
      renderAlerts(data);
    }

    document.getElementById('analyzeBtn').onclick = async () => {
      const btn = document.getElementById('analyzeBtn');
      const text = document.getElementById('tweetInput').value;
      if (!text) return;
      btn.textContent = 'Processing...';
      btn.disabled = true;
      await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      document.getElementById('tweetInput').value = '';
      btn.textContent = 'Process Signal';
      btn.disabled = false;
      fetchAlerts();
    };

    window.onload = () => {
      initMap();
      fetchAlerts();
      setInterval(fetchAlerts, 5000); // Live polling
    };
  </script>
</body>
</html>
